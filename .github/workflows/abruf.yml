name: Täglicher Abruf

on:
  schedule:
    - cron: "30 4 * * *"   # täglich 4:30 UTC (5:30 bzw. 6:30 Uhr in Deutschland)
  workflow_dispatch:
  pull_request:            # Probelauf ohne Speichern, um Änderungen zu prüfen

permissions:
  contents: write

concurrency:
  group: abruf
  cancel-in-progress: false

jobs:
  abruf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RADAR_CONTACT_EMAIL: ${{ secrets.RADAR_CONTACT_EMAIL }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      CINII_APPID: ${{ secrets.CINII_APPID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Journals in OpenAlex zuordnen (nur neue)
        run: python -m radar.resolve
      - name: Neue Artikel abrufen
        run: python -m radar.fetch
      - name: Ergebnis als Anhang sichern
        uses: actions/upload-artifact@v4
        with:
          name: radar-daten
          path: |
            docs/data/
            config/resolved.json
      - name: Speichern
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "fachartikel-radar"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data config/resolved.json
          if git diff --cached --quiet; then echo "Keine Änderungen."; exit 0; fi
          git commit -m "Abruf $(date -u +%Y-%m-%d)"
          git push
