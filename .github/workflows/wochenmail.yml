name: Wochenmail

on:
  schedule:
    # Dienstag 6 Uhr deutscher Zeit: 4:00 UTC (Sommerzeit) bzw. 5:00 UTC (Winterzeit).
    # Das Skript verschickt nur in dem Lauf, der gerade passt.
    - cron: "0 4 * * 2"
    - cron: "0 5 * * 2"
  workflow_dispatch:

jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Highlights verschicken
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          APP_URL: ${{ vars.APP_URL }}
          CRON: ${{ github.event.schedule }}
        run: python -m radar.digest
