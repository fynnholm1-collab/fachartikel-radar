# Journal-Liste für den Fachartikel-Radar.
#
# Felder:
#   name       Name des Journals (wird zur Suche in OpenAlex verwendet)
#   bereich    japan | fach | rand  (bestimmt den Reiter in der App)
#   prioritaet hoch | mittel | filter
#                hoch   = jeder Artikel im Posteingang
#                mittel = jeder Artikel im Reiter "Fach"
#                filter = nur Artikel, die zu einem Stichwort-Set passen (siehe "filter")
#   filter     Name eines Stichwort-Sets aus config/filters.yaml (nur bei prioritaet: filter)
#   thema      Zotero-Unterordner, in den "wichtig"-Artikel vorgeschlagen werden
#   issn       optional; sonst wird das Journal per Name in OpenAlex gesucht
#   rss        optional; Feed-Adresse, falls OpenAlex/Crossref das Journal nicht abdecken
#   quelle     optional: openalex (Standard) | crossref | rss | cinii
#   hinweis    freier Text, wird in der App angezeigt
#   hervorheben optional: Liste von Wörtern, bei denen ein Artikel markiert wird

journals:
  # ---------------- Japan: Kern-Journals (alle Artikel, Epochenregel) ----------------
  - {name: Monumenta Nipponica, bereich: japan, prioritaet: hoch, thema: Japan}
  - {name: Journal of Japanese Studies, bereich: japan, prioritaet: hoch, thema: Japan}
  - {name: Japan Review, bereich: japan, prioritaet: hoch, thema: Japan}
  - {name: Japanese Journal of Religious Studies, bereich: japan, prioritaet: hoch, thema: Japan}
  - {name: Harvard Journal of Asiatic Studies, bereich: japan, prioritaet: hoch, thema: Japan, filter: japan}
  - {name: Japan Forum, bereich: japan, prioritaet: hoch, thema: Japan}
  - {name: Japanese Studies, bereich: japan, prioritaet: hoch, thema: Japan}
  - {name: Social Science Japan Journal, bereich: japan, prioritaet: hoch, thema: Japan}
  - {name: Early Modern Japan, bereich: japan, prioritaet: hoch, thema: Japan}
  - {name: Review of Japanese Culture and Society, bereich: japan, prioritaet: hoch, thema: Japan}
  - {name: "The Asia-Pacific Journal: Japan Focus", bereich: japan, prioritaet: hoch, thema: Japan}
  - {name: Journal of Asian Studies, bereich: japan, prioritaet: hoch, thema: Japan, filter: japan}
  - {name: Japonica Humboldtiana, bereich: japan, prioritaet: hoch, thema: Japan}
  - {name: Nachrichten der Gesellschaft für Natur- und Völkerkunde Ostasiens, bereich: japan, prioritaet: hoch, thema: Japan, hinweis: NOAG}
  - {name: Asiatische Studien, bereich: japan, prioritaet: hoch, thema: Japan, filter: japan}
  - {name: Ebisu, bereich: japan, prioritaet: hoch, thema: Japan}
  # Japanischsprachig (Quelle CiNii; Anbindung wird getestet)
