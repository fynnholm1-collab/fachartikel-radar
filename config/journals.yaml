# Journal-Liste für den Fachartikel-Radar.
#
# Felder:
#   name       Name des Journals (wird zur Suche in OpenAlex verwendet)
#   bereich    japan | fach | rand  (bestimmt den Reiter in der App)
#   prioritaet hoch | filter
#                hoch   = Kern: jeder Artikel erscheint
#                filter = nur Artikel, die den Filter erfüllen (siehe "filter")
#   filter     Stichwort-Set aus config/filters.yaml oder eine dieser Regeln:
#                japan_oder_thema                 Japan-Bezug oder eines der Themen
#                japan_und_geschichte_oder_thema  Japan-Bezug und (Geschichte oder Thema)
#                ab_edo_oder_thema                Edo-Zeit bis heute oder eines der Themen
#   thema      Zotero-Unterordner, in den "wichtig"-Artikel vorgeschlagen werden
#   issn       optional; sonst wird das Journal per Name in OpenAlex gesucht
#   rss        optional; Feed-Adresse, falls OpenAlex/Crossref das Journal nicht abdecken
#   quelle     optional: openalex (Standard) | crossref | rss | cinii | keine
#   hinweis    freier Text, wird in der App angezeigt
#   hervorheben optional: Liste von Wörtern, bei denen ein Artikel markiert wird

journals:
  # Auswahl von Fynn, 31.10.2026 (Liste "Zeitschriften zum Ankreuzen").

  # ---------------- Japan ----------------
  - {name: Monumenta Nipponica, bereich: japan, prioritaet: hoch, thema: Japan}
  - {name: Journal of Japanese Studies, bereich: japan, prioritaet: hoch, thema: Japan}
  - {name: Japan Review, quelle: cinii, bereich: japan, prioritaet: hoch, thema: Japan, hinweis: Nichibunken}
  - {name: Harvard Journal of Asiatic Studies, bereich: japan, prioritaet: hoch, thema: Japan, filter: japan}
  - {name: Japan Forum, bereich: japan, prioritaet: hoch, thema: Japan}
  - {name: Japanese Studies, bereich: japan, prioritaet: hoch, thema: Japan}
  - {name: Japanese Journal of Religious Studies, bereich: japan, prioritaet: filter, filter: ab_edo_oder_thema, thema: Japan}
  - {name: 日本史研究, bereich: japan, prioritaet: filter, filter: ab_edo_oder_thema, thema: Japan, quelle: cinii, hinweis: Nihonshi kenkyū}
  - {name: 日本歴史, bereich: japan, prioritaet: filter, filter: ab_edo_oder_thema, thema: Japan, quelle: cinii, hinweis: Nihon rekishi}
  - {name: 史学雑誌, bereich: japan, prioritaet: filter, filter: ab_edo_oder_thema, thema: Japan, quelle: cinii, hinweis: Shigaku zasshi}
  - {name: 歴史学研究, bereich: japan, prioritaet: filter, filter: ab_edo_oder_thema, thema: Japan, quelle: cinii, hinweis: Rekishigaku kenkyū}
  - {name: 日本研究, bereich: japan, prioritaet: filter, filter: ab_edo_oder_thema, thema: Japan, quelle: cinii, hinweis: Nihon kenkyū (Nichibunken)}
  - {name: Journal of Asian Studies, bereich: japan, prioritaet: filter, filter: japan_und_geschichte_oder_thema, thema: Japan}
  - {name: Review of Japanese Culture and Society, bereich: japan, prioritaet: filter, filter: ab_edo_oder_thema, thema: Japan}
  - {name: "The Asia-Pacific Journal: Japan Focus", issn: 1557-4660, quelle: crossref, bereich: japan, prioritaet: filter, filter: ab_edo_oder_thema, thema: Japan}
  - {name: Asiatische Studien, bereich: japan, prioritaet: filter, filter: japan_und_geschichte_oder_thema, thema: Japan}

  # ---------------- Geschichte allgemein ----------------
