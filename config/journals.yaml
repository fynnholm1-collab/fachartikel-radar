  - {name: 日本史研究, bereich: japan, prioritaet: hoch, thema: Japan, quelle: cinii, hinweis: Nihonshi kenkyū}
  - {name: 歴史学研究, bereich: japan, prioritaet: hoch, thema: Japan, quelle: cinii, hinweis: Rekishigaku kenkyū}
