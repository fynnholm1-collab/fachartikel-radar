# Allgemeine Einstellungen

# Wie viele Tage zurück bei jedem Abruf gesucht wird. Bereits bekannte Artikel
# werden nicht doppelt aufgenommen; "neu" ist ein Artikel ab dem Tag, an dem
# der Radar ihn zum ersten Mal sieht.
rueckblick_tage: 60

# Posteingang: Artikel der letzten Monate (nach Erscheinungsdatum). Ältere landen im Backlog.
posteingang_monate: 6

# Backlog reicht bis zu diesem Datum zurück; ältere Artikel werden nicht gespeichert.
# Wird das Datum geändert, holt der nächste Abruf die fehlenden Jahrgänge nach.
backlog_ab: "2023-01-01"

# Wird diese Zahl erhöht, ruft der nächste Lauf alles ab backlog_ab neu ab (nach Regeländerungen).
datenstand: 2

# Einträge ohne Erscheinungsdatum bleiben so viele Tage nach dem ersten Auftauchen.
aufbewahren_tage: 400

# Maximale Länge der gespeicherten Abstracts (Zeichen).
abstract_laenge: 1500

katalog:
  # SRU-Schnittstelle des Verbundkatalogs K10plus (Gesamtkatalog).
  sru_url: https://sru.k10plus.de/opac-de-627
  # Woran der Bestand der UB Tübingen in den Exemplardaten erkannt wird.
  # Ist keines von beiden bekannt, zeigt die App "im Verbund vorhanden, bitte prüfen".
  isil: DE-21
  iln: 
  # Link zur Suche in "Katalog plus" der UB Tübingen; {q} wird durch den Suchbegriff ersetzt.
  katalog_link: https://rds-tue.ibs-bw.de/opac/RDSIndex/Search?lookfor={q}&type=allfields
  # Höchstzahl der Titelabgleiche pro Lauf (erkennt Rezensionen, deren Titel ein Buchtitel ist).
  titelabgleich_max: 250
  # Formular für Anschaffungsvorschläge der UB.
  anschaffungsvorschlag: http://www-ub.ub.uni-tuebingen.de/dienste/cgi-bin/avorschlag.cgi

zotero:
  # Sammlungen, die die App in Ihrer Zotero-Bibliothek anlegt (falls noch nicht vorhanden).
  eingang: _Eingang Fachliteratur
  unterordner: [Japan, Globalgeschichte, Umwelt- und Tiergeschichte, Digitale Geschichte, Theorie und Lehre]
  anschaffung: _Anschaffungswünsche
  tag: radar
