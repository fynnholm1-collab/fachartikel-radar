# Allgemeine Einstellungen

# Wie viele Tage zurück bei jedem Abruf gesucht wird. Bereits bekannte Artikel
# werden nicht doppelt aufgenommen; "neu" ist ein Artikel ab dem Tag, an dem
# der Radar ihn zum ersten Mal sieht.
rueckblick_tage: 60

# Wie lange Artikel in der App bleiben (danach nur noch in Zotero, falls gespeichert).
aufbewahren_tage: 400

# Maximale Länge der gespeicherten Abstracts (Zeichen).
abstract_laenge: 1500

katalog:
  # SRU-Schnittstelle des Verbundkatalogs K10plus, Bestand der UB Tübingen (ISIL DE-21).
  sru_url: https://sru.k10plus.de/opac-de-21
  # Link zur Suche in "Katalog plus" der UB Tübingen; {q} wird durch den Suchbegriff ersetzt.
  katalog_link: https://rds-tue.ibs-bw.de/opac/RDSIndex/Search?lookfor={q}&type=allfields
  # Formular für Anschaffungsvorschläge der UB.
  anschaffungsvorschlag: http://www-ub.ub.uni-tuebingen.de/dienste/cgi-bin/avorschlag.cgi

zotero:
  # Sammlungen, die die App in Ihrer Zotero-Bibliothek anlegt (falls noch nicht vorhanden).
  eingang: _Eingang Fachliteratur
  unterordner: [Japan, Globalgeschichte, Umwelt- und Tiergeschichte, Digitale Geschichte, Theorie und Lehre]
  anschaffung: _Anschaffungswünsche
  tag: radar
